---
# 1 :- Deploy Webserver Resources
- name: Deploy Webservers on VM1 and VM2
  hosts: webservers
  become: yes
  tags: deploy
  tasks:
    - name: Install Nginx webserver
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configure Nginx to listen on port 8080
      template:
        src: templates/default.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Restart Nginx

    - name: Create index.html with dynamic SJSU-X message
      copy:
        content: "Hello World from SJSU-{{ sjsu_id }}\n"
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Nginx is started and enabled on boot
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted

# 2:- Un-deploy Webserver Resources
- name: Un-deploy Webservers on VM1 and VM2
  hosts: webservers
  become: yes
  tags: undeploy
  tasks:
    - name: Stop Nginx service
      service:
        name: nginx
        state: stopped
      ignore_errors: yes

    - name: Remove Nginx and its dependencies
      apt:
        name: nginx
        state: absent
        autoremove: yes
        purge: yes

    - name: Remove web root directory and custom HTML
      file:
        path: /var/www/html
        state: absent
